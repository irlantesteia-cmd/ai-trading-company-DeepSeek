[project]
name = "ai-trading-company"
version = "0.1.0"
description = "Sistema de Day Trade autônomo multi-IA"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "asyncpg>=0.29.0",
    "alembic>=1.13.0",
    "redis>=5.0.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "python-dotenv>=1.0.0",
    "python-json-logger>=2.0.7",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "joblib>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "respx>=0.21.0",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = [
    "tests*",
    "migrations*",
    "data*",
    "artifacts*",
    "models*",
    "logs*",
    "docker*",
    "scripts*",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
[tool.mypy]
python_version = "3.12"
files = ["app"]

[[tool.mypy.overrides]]
# Sem stubs de tipos publicados.
module = ["joblib", "joblib.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true
